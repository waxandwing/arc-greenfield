<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Arc — Join the interest list</title><style>
:root{--paper:#f7f3e8;--ink:#29342e;--muted:#6f7d74;--coral:#e7794f;--blue:#c7e7f3;--line:#d8d3c5}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}body{font-family:Montserrat,Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{min-height:100dvh;display:grid;place-items:center;padding:28px 20px}.card{width:min(560px,100%);padding:clamp(26px,5vw,44px);border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.55)}.eyebrow{margin:0 0 12px;color:var(--coral);font-size:11px;font-weight:800;letter-spacing:.17em;text-transform:uppercase}h1{margin:0;font:400 clamp(38px,7vw,56px)/1 Georgia,serif;letter-spacing:-.04em}.intro{margin:14px 0 26px;color:var(--muted);font:17px/1.5 Georgia,serif}form{display:grid;gap:14px}label{display:grid;gap:7px;font-size:12px;font-weight:800;letter-spacing:.04em}input,select{width:100%;min-height:48px;border:1px solid #bdb7aa;border-radius:9px;background:#fffdf8;color:var(--ink);padding:10px 12px;font:16px/1.2 inherit}input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}.honeypot{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}button{min-height:48px;border:0;border-radius:9px;background:var(--ink);color:white;font-size:12px;font-weight:800;cursor:pointer}button[disabled]{opacity:.6;cursor:wait}.status{min-height:22px;margin:2px 0 0;font-size:14px;color:var(--muted)}.status.error{color:#9a352f}.back{display:inline-block;margin-top:20px;color:var(--ink);font-size:12px;font-weight:800;text-underline-offset:3px}</style></head><body><main><section class="card" aria-labelledby="interest-title"><p class="eyebrow">ARC</p><h1 id="interest-title">Keep me posted.</h1><p class="intro">Leave your email and we’ll let you know when Arc is ready for a wider release.</p><form id="interest-form" novalidate><label>Email<input id="email" name="email" type="email" autocomplete="email" required></label><label>Name <span style="font-weight:400;color:var(--muted)">(optional)</span><input id="name" name="name" type="text" autocomplete="name"></label><label>What best describes you? <span style="font-weight:400;color:var(--muted)">(optional)</span><select id="role" name="role"><option value="">Choose one</option><option>Classroom teacher</option><option>Department chair / instructional lead</option><option>School or district leader</option><option>Education creator / consultant</option><option>Other</option></select></label><div class="honeypot" aria-hidden="true"><label>Website<input id="website" name="website" tabindex="-1" autocomplete="off"></label></div><button id="submit" type="submit">Join the interest list</button><p id="status" class="status" role="status" aria-live="polite"></p></form><a class="back" href="/">← Back to Arc</a></section></main><script>
(()=>{const SUPABASE_URL='https://jnbppgjkzzuquhenaqtq.supabase.co';const SUPABASE_KEY='sb_publishable_0wnc_Y6ccYUsA78VGjmOKw_d0zTig_V';const form=document.getElementById('interest-form');const status=document.getElementById('status');const submit=document.getElementById('submit');form.addEventListener('submit',async(event)=>{event.preventDefault();status.className='status';status.textContent='';if(document.getElementById('website').value)return;const email=document.getElementById('email').value.trim();const name=document.getElementById('name').value.trim();const role=document.getElementById('role').value;if(!email||!/^\S+@\S+\.\S+$/.test(email)){status.className='status error';status.textContent='Enter a valid email address.';return}submit.disabled=true;submit.textContent='Adding you…';try{const response=await fetch(`${SUPABASE_URL}/rest/v1/arc_interest_signups`,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({email,name:name||null,role:role||null,source:'landing'})});if(response.ok||response.status===201){form.reset();status.textContent='You’re on the list. Thank you.'}else if(response.status===409){status.textContent='You’re already on the list.'}else{const detail=await response.text();console.error('Arc interest signup failed',response.status,detail);status.className='status error';status.textContent='We couldn’t add you right now. Please try again.'}}catch(error){console.error(error);status.className='status error';status.textContent='We couldn’t add you right now. Please try again.'}finally{submit.disabled=false;submit.textContent='Join the interest list'}})})();
</script></body></html>
