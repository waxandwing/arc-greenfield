<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arc — Signing in</title><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f4f2ed;color:#26372f;font-family:system-ui,sans-serif}.wrap{max-width:560px;padding:32px;text-align:center}h1{font-family:Georgia,serif;font-weight:400}.brand{font-family:Georgia,serif;font-size:48px}.error{color:#9a352f}</style></head><body><main class="wrap"><div class="brand">Arc</div><p id="status">Finishing sign-in…</p></main><script type="module">
