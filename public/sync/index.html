<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arc — Optional sync</title><style>
:root{--paper:#f7f3e8;--ink:#29342e;--muted:#5e6b63;--blue:#c7e7f3}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}body{font-family:Montserrat,Inter,system-ui,sans-serif}main{min-height:100dvh;display:grid;place-items:center;padding:24px}.wrap{width:min(520px,100%);text-align:center}.mark{font:400 54px/.9 Georgia,serif;letter-spacing:-.06em;margin-bottom:34px}h1{margin:0;font:400 42px/1 Georgia,serif;letter-spacing:-.04em}.copy{margin:16px auto 26px;max-width:430px;color:var(--muted);font:16px/1.55 Georgia,serif}.actions{display:grid;gap:10px;width:min(390px,100%);margin:auto}button,a{min-height:48px;border-radius:4px;display:grid;place-items:center;padding:10px 14px;font-size:12px;font-weight:800;text-decoration:none;cursor:pointer}.google{border:1px solid var(--ink);background:var(--ink);color:#fff}.skip{border:1px solid #bfc9c3;background:var(--blue);color:var(--ink)}.error{min-height:20px;color:#913f35;font-size:13px}</style></head><body><main><section class="wrap"><div class="mark">Arc</div><h1>Sync is optional.</h1><p class="copy">Connect Google if you want Arc to work with your account. You can also skip this and use the beta without Google.</p><div class="actions"><button class="google" id="google">Connect Google</button><a class="skip" href="/core/planner">Skip for now</a><p class="error" id="error" role="alert"></p></div></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.4';const error=document.getElementById('error');const access=await fetch('/api/beta-access',{cache:'no-store'}).then(r=>r.json()).catch(()=>({unlocked:false}));if(!access.unlocked)location.replace('/beta');const supabase=createClient('https://jnbppgjkzzuquhenaqtq.supabase.co','sb_publishable_0wnc_Y6ccYUsA78VGjmOKw_d0zTig_V',{auth:{flowType:'pkce',detectSessionInUrl:false,persistSession:true,autoRefreshToken:true}});document.getElementById('google').addEventListener('click',async()=>{error.textContent='';sessionStorage.setItem('arc-auth-return','/core/planner');const {error:e}=await supabase.auth.signInWithOAuth({provider:'google',options:{redirectTo:`${location.origin}/auth/callback/`}});if(e)error.textContent='Google sync could not start. You can skip it and continue into Arc.'});
</script></body></html>
