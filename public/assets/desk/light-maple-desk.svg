<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="maple-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f0e4"/>
      <stop offset="38%" stop-color="#eedfc8"/>
      <stop offset="72%" stop-color="#e2cfa8"/>
      <stop offset="100%" stop-color="#d4bc8e"/>
    </linearGradient>
    <linearGradient id="maple-wash" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fffaf2" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#fffaf2" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8b6914" stop-opacity="0.06"/>
    </linearGradient>
    <pattern id="maple-grain-fine" width="6" height="1200" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="6" height="1200" fill="#e8d5b8"/>
      <rect x="0" width="1" height="1200" fill="#dcc9a6" opacity="0.35"/>
      <rect x="2.5" width="0.6" height="1200" fill="#f5ead8" opacity="0.5"/>
      <rect x="4.2" width="0.8" height="1200" fill="#c4a574" opacity="0.12"/>
    </pattern>
    <pattern id="maple-grain-wide" width="180" height="1200" patternUnits="userSpaceOnUse">
      <rect width="180" height="1200" fill="transparent"/>
      <path d="M0 0 Q90 80 180 0 T360 0" fill="none" stroke="#c9a063" stroke-width="1.2" opacity="0.08" transform="translate(0 220)"/>
      <path d="M0 0 Q90 -60 180 0 T360 0" fill="none" stroke="#b8894a" stroke-width="0.9" opacity="0.06" transform="translate(-40 520)"/>
      <path d="M0 0 Q90 100 180 0" fill="none" stroke="#dfc498" stroke-width="1.4" opacity="0.07" transform="translate(20 860)"/>
    </pattern>
    <radialGradient id="maple-vignette" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#5c4020" stop-opacity="0.14"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1200" fill="url(#maple-base)"/>
  <rect width="1600" height="1200" fill="url(#maple-grain-fine)" opacity="0.85"/>
  <rect width="1600" height="1200" fill="url(#maple-grain-wide)" opacity="0.9"/>
  <rect width="1600" height="1200" fill="url(#maple-wash)"/>
  <rect width="1600" height="1200" fill="url(#maple-vignette)"/>
</svg>
