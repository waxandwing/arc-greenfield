name: B05 B06 furniture Task Bar

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  b05-b06-primary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v5
      - name: Use repository Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install exact dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Chromium audit runtime
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build browser target
        run: npm run build
      - name: Run B05/B06 primary rendered gate
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/arc-preview-b05-b06.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          ARC_BASE_URL=http://127.0.0.1:4173 node tests/b05-b06-furniture-taskbar.smoke.mjs
      - name: Publish B05/B06 primary renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-b05-b06-primary
          path: artifacts/b05-b06/*.png
          if-no-files-found: warn
          retention-days: 7

  b05-b06-independent:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v5
      - name: Use repository Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install exact dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Chromium audit runtime
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build browser target
        run: npm run build
      - name: Run independent B05/B06 rendered audit
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/arc-preview-b05-b06-independent.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          ARC_BASE_URL=http://127.0.0.1:4173 node tests/b05-b06-furniture-taskbar-independent.mjs
      - name: Publish independent B05/B06 renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-b05-b06-independent
          path: artifacts/b05-b06-independent/*.png
          if-no-files-found: warn
          retention-days: 7
