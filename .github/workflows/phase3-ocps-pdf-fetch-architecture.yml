name: Phase 3 OCPS PDF fetch architecture

on:
  push:
    branches:
      - audit/phase3-ocps-pdf-fetch-architecture
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  ocps-pdf-browser-fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v5
      - name: Use repository Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install exact dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Chromium audit runtime
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build browser target
        run: npm run build
      - name: Prove runner can reach official OCPS PDF outside browser CORS
        run: |
          PDF_URL='https://www.ocps.net/UserFiles/Servers/Server_54619/File/Frequently%20Updated%20Documents/2026-2027%20School%20Calendar.pdf'
          curl -L --fail --silent --show-error "$PDF_URL" -o /tmp/ocps-calendar.pdf
          echo "server_byte_length=$(wc -c < /tmp/ocps-calendar.pdf)"
          printf 'server_prefix='
          head -c 5 /tmp/ocps-calendar.pdf
          printf '\n'
      - name: Probe browser-origin access to official OCPS PDF
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/arc-preview-phase3-ocps-pdf-fetch.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          ARC_BASE_URL=http://127.0.0.1:4173 node tests/phase3-ocps-pdf-browser-fetch.mjs
