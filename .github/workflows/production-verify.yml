name: Production verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact production candidate
        uses: actions/checkout@v5
      - name: Use repository Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install exact dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run canonical contracts, typecheck, and production build
        run: npm run build
      - name: Install pinned Chromium audit runtime
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run rendered production audit suite
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/arc-production-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          ARC_BASE_URL=http://127.0.0.1:4173 npm run test:browser-a11y
          ARC_BASE_URL=http://127.0.0.1:4173 node tests/rgav-shell-independent.mjs
          ARC_BASE_URL=http://127.0.0.1:4173 node tests/phase2-planning-truth.mjs
          ARC_BASE_URL=http://127.0.0.1:4173 node tests/phase2-object-actions-section-divergence.mjs
          ARC_BASE_URL=http://127.0.0.1:4173 node tests/phase2-calendar-edge-planning-truth.mjs
          ARC_BASE_URL=http://127.0.0.1:4173 node tests/phase2-recovery-undo-continuity.mjs
          ARC_BASE_URL=http://127.0.0.1:4173 node tests/phase2-nondrag-keyboard-parity.mjs
      - name: Publish production audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-production-audit
          path: |
            artifacts/phase1-shell-1280.png
            artifacts/phase2-behavior/*.png
          if-no-files-found: warn
          retention-days: 14
