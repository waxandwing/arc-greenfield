name: Phase 2 independent RGAV

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  rgav-phase2-independent:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v5
      - name: Use repository Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install exact dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Chromium audit runtime
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build exact browser target
        run: npm run build
      - name: Run independent Phase 2 RGAV B
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/arc-preview-phase2-final-rgav.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          ARC_BASE_URL=http://127.0.0.1:4173 node tests/rgav-phase2-independent.mjs
