name: Gold Master verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-gold-master:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v5
      - name: Use repository Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install exact dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and build bundle
        run: |
          npm run typecheck
          npm run build:bundle
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Render every Gold Master and handoff-authority state
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/arc-gold-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/?gold=week > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/?gold=week > /dev/null
          ARC_BASE_URL=http://127.0.0.1:4173 npm run test:gold-master
          ARC_BASE_URL=http://127.0.0.1:4173 npm run test:gold-handoff
          ARC_BASE_URL=http://127.0.0.1:4173 node tests/gold-master-layout-rigor.mjs
      - name: Publish Gold Master screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-gold-master-screens
          path: |
            docs/overnight/evidence/gold-master/*.png
            docs/overnight/evidence/gold-master-rigor/*.png
            docs/overnight/evidence/gold-handoff/*.png
          if-no-files-found: warn
          retention-days: 14
