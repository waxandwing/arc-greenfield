name: B02 Week object grammar

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  b02-week-object-grammar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v5
      - name: Use repository Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install exact dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Chromium audit runtime
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build browser target
        run: npm run build
      - name: Run B02 Week object grammar gate
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/arc-preview-b02.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          ARC_BASE_URL=http://127.0.0.1:4173 node tests/b02-week-object-grammar.smoke.mjs
      - name: Publish exact B02 Week renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-b02-week-object-grammar
          path: artifacts/b02-week-object-grammar/*.png
          if-no-files-found: warn
          retention-days: 7

  b02-week-object-grammar-independent:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit independently
        uses: actions/checkout@v5
      - name: Use repository Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install exact dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Chromium audit runtime
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build browser target independently
        run: npm run build
      - name: Run independent B02 Week hierarchy and brand audit
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/arc-preview-b02-independent.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          ARC_BASE_URL=http://127.0.0.1:4173 node tests/b02-week-object-grammar-independent.mjs
      - name: Publish independent B02 Week renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-b02-week-object-grammar-independent
          path: artifacts/b02-week-object-grammar-independent/*.png
          if-no-files-found: warn
          retention-days: 7
