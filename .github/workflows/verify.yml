name: Verify Arc Greenfield

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Block high or critical dependency advisories
        run: npm audit --audit-level=high
      - name: Enforce no-Vercel deployment law
        run: node -e 'const c=require("./vercel.json"); if (c.git?.deploymentEnabled !== false) { console.error("Vercel Git deployment must remain disabled unless founder explicitly reverses the law."); process.exit(1); }'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify canonical build contract exists
        run: test -f CANONICAL_BUILD.json