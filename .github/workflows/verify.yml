name: Verify Arc Greenfield

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Capture dependency audit evidence
        run: npm audit --json > npm-audit.json || true
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Chromium for rendered checks
        run: npx playwright install --with-deps chromium
      - name: Run rendered Arc checks
        run: npm run test:browser
      - name: Upload rendered Arc evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-rendered-evidence
          path: |
            playwright-report
            test-results
            package-lock.json
            npm-audit.json
          if-no-files-found: error
      - name: Verify canonical build contract exists
        run: test -f CANONICAL_BUILD.json
