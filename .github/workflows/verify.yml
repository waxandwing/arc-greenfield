name: Arc verify

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Arc build gate
        run: npm run build

      - name: Install pinned Chromium audit runtime
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run interface browser audits
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/arc-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          ARC_BASE_URL=http://127.0.0.1:4173 node tests/day-interface.browser.mjs
          ARC_BASE_URL=http://127.0.0.1:4173 node tests/week-interface.browser.mjs
          ARC_BASE_URL=http://127.0.0.1:4173 node tests/month-interface.browser.mjs
          ARC_BASE_URL=http://127.0.0.1:4173 node tests/cross-view-readability.browser.mjs
          ARC_BASE_URL=http://127.0.0.1:4173 node tests/object-actions-fridge.browser.mjs
